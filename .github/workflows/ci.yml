name: CI

on:
  pull_request:
  push:
    branches: [main, fix/import-pipeline-hardening]

# Newer pushes to the same ref cancel in-flight runs (the test job is long).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app

  test:
    name: Tests (testcontainers Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev --frozen
      - name: Pytest
        # GitHub-hosted ubuntu runners ship a running Docker daemon, so the
        # testcontainers Postgres fixture works out of the box. Ryuk (the
        # container reaper) is unnecessary on an ephemeral runner and can be
        # flaky, so it is disabled.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          IMPORT_PIPELINE_EVIDENCE_DIR: ci-artifacts/import-pipeline
        run: uv run pytest -q
      - name: Upload import pipeline evidence
        uses: actions/upload-artifact@v4
        with:
          name: import-pipeline-evidence
          path: ci-artifacts/import-pipeline/A23.json
          if-no-files-found: error
      - name: Verify vector consumers on pgvector
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          PGVECTOR_ENABLED: "true"
        run: uv run pytest -q tests/services/test_current_vector_consumers.py

  recommendation-eval:
    name: Recommendation eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev --frozen
      - name: Run deterministic recommendation eval
        run: make recommendation-eval
      - name: Upload recommendation eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-eval-report
          path: evals/reports/
          if-no-files-found: error

  migration:
    name: Alembic round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aidrobe
          POSTGRES_PASSWORD: aidrobe
          POSTGRES_DB: aidrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidrobe -d aidrobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@localhost:5432/aidrobe
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev --frozen
      - name: Upgrade, downgrade, and re-upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev --frozen
      - name: Generate contract
        run: make openapi
      - name: Upload generated contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: |
            docs/openapi.json
            docs/openapi.yaml
          if-no-files-found: error
      - name: Check committed contract
        run: git diff --exit-code -- docs/openapi.json docs/openapi.yaml

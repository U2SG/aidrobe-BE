  /v1/uploads/sts-token:
    post:
      tags:
      - uploads
      summary: Issue Sts Token
      description: 'Issue narrow-scoped temporary OSS credentials.


        The returned token can ONLY (a) hit `users/<this-user>/<action>/` prefix

        of the named bucket, (b) for the requested verb, (c) for the configured

        TTL. iOS uses this to upload originals directly without ever holding a

        permanent AccessKey — server never sees the bytes (saves bandwidth).'
      operationId: issue_sts_token_v1_uploads_sts_token_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:

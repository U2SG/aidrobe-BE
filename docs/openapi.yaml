          type: array
          title: Insights
      type: object
      required:
      - score
      - level
      - insights
      title: WardrobeHealthResponse
      description: 'Wardrobe health score + insights, fully i18n-safe.


        ``score``: int 0-100. ``level``: stable code ``great`` / ``good`` /

        ``fair`` / ``low`` (FE localizes the headline). No baked English summary —


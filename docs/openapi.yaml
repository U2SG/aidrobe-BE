  /v1/style/sources:
    post:
      tags:
      - style
      summary: Add Pdf Source
      description: 'M19 — async PDF / magazine multi-page style ingest.


        `ENABLE_PDF_STYLE_INGEST` is an upload-ingest kill switch (default off).

        Flag=off → gate-and-reject (no row created). Convention: data-always-persists

        applies to user-triggered flags (ENABLE_TODAY_REFRESH etc.), not to this

        upload-ingest kill-switch where creating a row with no processing is meaningless.

        `estimated_pages` is best-effort 0 at enqueue: the real count is only known

        once the worker downloads and rasterizes the PDF, and blocking the request
        on

        an OSS fetch would defeat the async design.'
      operationId: add_pdf_source_v1_style_sources_post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-User-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdfStyleSourceRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel_PdfStyleSourceResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

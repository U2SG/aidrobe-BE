      - metrics
      title: WardrobeHealthInsightItem
      description: "A single wardrobe-health insight as i18n-safe codes + numbers.\n\
        \nThe backend never returns user-facing copy; the frontend localizes from\
        \ the\nstable ``type`` code and the numeric ``metrics``.\n\n``type`` (stable\
        \ machine codes):\n- ``wear_coverage`` — share of items worn recently.\n \
        \ ``metrics``: ``{\"coverage_ratio\": float (0-1), \"window_days\": int (90)}``\n\
        - ``unused_items`` — items not worn within rolling windows.\n  ``metrics``:\
        \ ``{\"unused_60\": int, \"unused_90\": int, \"unused_180\": int}``\n- ``category_balance``\
        \ — concentration across categories.\n  ``metrics``: ``{\"dominant_ratio\"\
        : float (0-1), \"counts\": {<category>: int}}``;\n  empty ``metrics`` ``{}``\
        \ when balance can't be computed yet.\n- ``data_sparsity`` — emitted only\
        \ for an empty wardrobe.\n  ``metrics``: ``{\"item_count\": 0}``.\n\n``severity``:\
        \ stable code ``low`` / ``medium`` / ``high``."

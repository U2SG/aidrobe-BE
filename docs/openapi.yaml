components:
  schemas:
    AddInspirationRequest:
      properties:
        image_url:
          anyOf:
          - type: string
            maxLength: 1024
            minLength: 1
          - type: 'null'
          title: Image Url
        source_url:
          anyOf:
          - type: string
            maxLength: 1024
            minLength: 1
          - type: 'null'
          title: Source Url
      type: object
      title: AddInspirationRequest
    AdminAsyncJobItem:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
        job_type:
          type: string
          title: Job Type
        status:
          type: string
          title: Status
        attempts:
          type: integer
          title: Attempts
        max_attempts:
          type: integer
          title: Max Attempts
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        target_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Target Id
        cost_tokens:
          type: integer
          title: Cost Tokens
          default: 0
        cost_cents:
          type: integer
          title: Cost Cents
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        next_run_at:
          type: string
          format: date-time
          title: Next Run At
        lease_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lease Expires At
      type: object
      required:
      - job_id
      - job_type
      - status
      - attempts
      - max_attempts
      - created_at
      - updated_at
      - next_run_at
      title: AdminAsyncJobItem
    AdminAsyncJobListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminAsyncJobItem'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: AdminAsyncJobListResponse
    AppleLoginRequest:
      properties:
        id_token:
          type: string
          minLength: 1
          title: Id Token
      type: object
      required:
      - id_token
      title: AppleLoginRequest
    AskContext:
      properties:
        date:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
        scene:
          anyOf:
          - type: string
          - type: 'null'
          title: Scene
        time_left_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Time Left Minutes
      type: object
      title: AskContext
    AskConversationDeltas:
      properties:
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
        applied_constraints:
          items:
            type: string
          type: array
          title: Applied Constraints
      type: object
      title: AskConversationDeltas
    AskHistoryItem:
      properties:
        ask_session_id:
          type: string
          format: uuid
          title: Ask Session Id
        question:
          type: string
          title: Question
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
        item_refs:
          items:
            type: string
          type: array
          title: Item Refs
        item_ref_snapshots:
          items:
            $ref: '#/components/schemas/AskItemRefSnapshot'
          type: array
          title: Item Ref Snapshots
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - ask_session_id
      - question
      - created_at
      title: AskHistoryItem
    AskItemRefSnapshot:
      properties:
        item_id:
          type: string
          format: uuid
          title: Item Id
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
        color_main:
          type: string
          title: Color Main
        thumbnail_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
      type: object
      required:
      - item_id
      - name
      - category
      - color_main
      title: AskItemRefSnapshot
      description: 'BE#29 — denormalized card for a referenced wardrobe item so the
        client

        can render related items without a per-id detail fetch. Only the current

        user''s accessible, non-deleted items appear; `thumbnail_url` is signed at

        request time (never a persisted TTL-bound URL).'
    AskRequest:
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
        context:
          anyOf:
          - $ref: '#/components/schemas/AskContext'
          - type: 'null'
        locale:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Locale
        focused_item_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Focused Item Id
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Conversation Id
      type: object
      required:
      - question
      title: AskRequest
    AskResponse:
      properties:
        ask_session_id:
          type: string
          format: uuid
          title: Ask Session Id
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Conversation Id
        answer:
          type: string
          title: Answer
        item_refs:
          items:
            type: string
          type: array
          title: Item Refs
        item_ref_snapshots:
          items:
            $ref: '#/components/schemas/AskItemRefSnapshot'
          type: array
          title: Item Ref Snapshots
        has_wardrobe_context:
          type: boolean
          title: Has Wardrobe Context
          default: false
        locale:
          type: string
          title: Locale
          default: zh-CN
        tokens_used:
          type: integer
          title: Tokens Used
        deltas:

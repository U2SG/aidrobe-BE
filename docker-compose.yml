services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file:
      - path: .env
        required: false
    environment:
      ENABLE_SCHEDULER: "false"
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      # The postgres image ships pgvector and migration 0012 creates
      # item_embeddings.vector as vector(512); the ORM must use the same type
      # (it falls back to JSONB, for test databases, when this is unset).
      PGVECTOR_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Host the CLIENT reaches (on-device over LAN/Tailscale, browser, ...).
      # It's baked into image URLs, so it must resolve from the client — set
      # S3_PUBLIC_BASE_URL in .env (e.g. a Tailscale IP) for device testing.
      # Was hardcoded to localhost, which broke on-device images on recreate.
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/aidrobe}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: .
    command: python -m app.jobs.scheduler
    env_file:
      - path: .env
        required: false
    environment:
      ENABLE_SCHEDULER: "true"
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      # The postgres image ships pgvector and migration 0012 creates
      # item_embeddings.vector as vector(512); the ORM must use the same type
      # (it falls back to JSONB, for test databases, when this is unset).
      PGVECTOR_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # No HTTP listener here — the image-level HEALTHCHECK (curl :8000) inherited
    # from the Dockerfile reports unhealthy forever. Liveness signal is process
    # exit + restart policy.
    healthcheck:
      disable: true

  # arq worker — drains the async-jobs queues (embedding, outfit_board,
  # ootd_poster, cutout, user_purge) via worker_main's cron ticks + the
  # lease-recovery / dead-letter reconcile sweeps. Without this service those
  # jobs only ever enqueue and never run. Container-internal addresses;
  # ARQ_REDIS_URL points at the redis service (the .env value is host-oriented
  # for running arq directly on the host).
  worker:
    build: .
    command: arq app.infrastructure.workers.worker_main.WorkerSettings
    env_file:
      - path: .env
        required: false
    environment:
      ENABLE_SCHEDULER: "false"
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      # The postgres image ships pgvector and migration 0012 creates
      # item_embeddings.vector as vector(512); the ORM must use the same type
      # (it falls back to JSONB, for test databases, when this is unset).
      PGVECTOR_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/aidrobe}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # arq refreshes a redis heartbeat key every health_check_interval (60s, set
    # in WorkerSettings); `arq --check` reads it back, so health reflects the
    # worker loop actually ticking — unlike the inherited curl :8000 check
    # (no HTTP listener here).
    healthcheck:
      test: ["CMD", "arq", "--check", "app.infrastructure.workers.worker_main.WorkerSettings"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      # The postgres image ships pgvector and migration 0012 creates
      # item_embeddings.vector as vector(512); the ORM must use the same type
      # (it falls back to JSONB, for test databases, when this is unset).
      PGVECTOR_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # One-shot alembic run gated on service_completed_successfully; the
    # inherited curl :8000 HEALTHCHECK is meaningless for it.
    healthcheck:
      disable: true

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aidrobe
      POSTGRES_USER: aidrobe
      POSTGRES_PASSWORD: aidrobe
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidrobe -d aidrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object store. MinIO stopped publishing community images
  # (minio/minio is gone from Docker Hub), so this runs RustFS (Apache-2.0,
  # S3 API incl. presigned POST). The service keeps the name `minio`: clients
  # rewrite presigned upload URLs whose host is `minio`, and S3_ENDPOINT_URL
  # points here. Data written by the old MinIO image is not readable by RustFS.
  minio:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket and makes objects anonymously readable (image URLs are
  # served straight from S3_PUBLIC_BASE_URL). Uses boto3 from the app image.
  minio-init:
    build: .
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-aidrobe}
    command:
      - python
      - -c
      - |
        import json, os, boto3
        bucket = os.environ["S3_BUCKET"]
        s3 = boto3.client(
            "s3",
            endpoint_url="http://minio:9000",
            aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
            region_name="us-east-1",
        )
        if bucket not in {b["Name"] for b in s3.list_buckets().get("Buckets", [])}:
            s3.create_bucket(Bucket=bucket)
        s3.put_bucket_policy(Bucket=bucket, Policy=json.dumps({
            "Version": "2012-10-17",
            "Statement": [{"Effect": "Allow", "Principal": {"AWS": ["*"]},
                           "Action": ["s3:GetObject"], "Resource": [f"arn:aws:s3:::{bucket}/*"]}],
        }))
        print(f"bucket {bucket} ready")
    restart: "no"
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

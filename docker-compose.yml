services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    environment:
      ENABLE_SCHEDULER: "false"
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Host the CLIENT reaches (on-device over LAN/Tailscale, browser, ...).
      # It's baked into image URLs, so it must resolve from the client — set
      # S3_PUBLIC_BASE_URL in .env (e.g. a Tailscale IP) for device testing.
      # Was hardcoded to localhost, which broke on-device images on recreate.
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/aidrobe}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: .
    command: python -m app.jobs.scheduler
    env_file: .env
    environment:
      ENABLE_SCHEDULER: "true"
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # arq worker — drains the async-jobs queues (embedding, outfit_board,
  # ootd_poster, cutout, user_purge) via worker_main's cron ticks + the
  # lease-recovery / dead-letter reconcile sweeps. Without this service those
  # jobs only ever enqueue and never run. Container-internal addresses;
  # ARQ_REDIS_URL points at the redis service (the .env value is host-oriented
  # for running arq directly on the host).
  worker:
    build: .
    command: arq app.infrastructure.workers.worker_main.WorkerSettings
    env_file: .env
    environment:
      ENABLE_SCHEDULER: "false"
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/aidrobe}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aidrobe:aidrobe@postgres:5432/aidrobe
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aidrobe
      POSTGRES_USER: aidrobe
      POSTGRES_PASSWORD: aidrobe
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidrobe -d aidrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-minioadmin} $${S3_SECRET_ACCESS_KEY:-minioadmin};
        mc mb --ignore-existing local/$${S3_BUCKET:-aidrobe};
        mc anonymous set download local/$${S3_BUCKET:-aidrobe};
        exit 0;
      "
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:

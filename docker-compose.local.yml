# Zero-cost local stack: every paid / external provider is forced to its fake
# or disabled variant, whatever `.env` says. `environment:` here wins over
# `env_file`, so a `.env` written for another host (real API keys, Tailscale
# URLs) cannot trigger calls or point uploads elsewhere.
#
#   scripts/dev-up.sh            # build + start, then smoke-check
#   docker compose -f docker-compose.yml -f docker-compose.local.yml down
#
# To test from a phone, export AIDROBE_PUBLIC_HOST=<this Mac's LAN/Tailscale IP>
# before dev-up so presigned upload / image URLs resolve from the device.
#
# Real garment recognition is opt-in: set AIDROBE_VISION_PROVIDER=qwen (in the
# shell or in .env, which compose reads for substitution) with QWEN_API_KEY in
# .env. Cost ≈ ¥0.0025 per single-garment photo, ≈ ¥0.007 per outfit photo.
# Likewise AIDROBE_LLM_PROVIDER=qwen enables Ask and the Today reason polish
# (qwen3.8-flash, thinking off; well under ¥0.001 per call). Ask stays 503
# without it. AIDROBE_WEATHER_PROVIDER=qweather uses QWEATHER_API_KEY /
# QWEATHER_BASE_URL from .env (first 50k calls a month are free; cached 1 h).

x-zero-cost: &zero-cost
  APP_ENV: dev
  GIT_SHA: ${GIT_SHA:-unknown}
  VISION_PROVIDER: ${AIDROBE_VISION_PROVIDER:-fake}
  OCR_PROVIDER: fake
  LLM_PROVIDER: ${AIDROBE_LLM_PROVIDER:-none}
  EMBEDDING_PROVIDER: fake
  WEATHER_PROVIDER: ${AIDROBE_WEATHER_PROVIDER:-none}
  IMAGE_CUTOUT_PROVIDER: ${AIDROBE_IMAGE_CUTOUT_PROVIDER:-fake}
  ENABLE_ITEM_CUTOUT: ${AIDROBE_ENABLE_ITEM_CUTOUT:-false}
  ENABLE_RECEIPT_IMPORT: "false"
  ENABLE_V3_ANALYTICS: "false"
  ENABLE_IMPORT_ASYNC_JOBS: "true"
  STORAGE_PROVIDER: s3
  S3_BUCKET: aidrobe
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_BASE_URL: http://${AIDROBE_PUBLIC_HOST:-localhost}:9000/aidrobe

# The product's feature set (mirrors the switches the deployed .env turned on),
# minus everything that needs a paid or unavailable provider: Ask (LLM), item
# cutout / receipt import / OOTD poster / PDF + vision style learning, Aliyun
# STS. SenseCheck is retired in favour of the V3 purchase decision.
x-product-flags: &product-flags
  ENABLE_DATE_AWARE_TODAY: "true"
  ENABLE_TODAY_CONTEXT: "true"
  ENABLE_TODAY_REASONING: "true"
  ENABLE_TODAY_REFRESH: "true"
  ENABLE_CONTEXT_OVERRIDES: "true"
  ENABLE_RECOMMENDATION_DIVERSITY: "true"
  ENABLE_WARDROBE_GRAPH: "true"
  ENABLE_PREFERENCE_MEMORY: "true"
  ENABLE_FEEDBACK_LEARNING: "true"
  ENABLE_INDOOR_CLIMATE_INFERENCE: "true"
  ENABLE_RESURFACE_INSIGHT: "true"
  ENABLE_OBSTACLES: "true"
  ENABLE_OUTFIT_SCORES: "true"
  ENABLE_PREP_STEPS: "true"
  ENABLE_OUTFIT_CALENDAR: "true"
  ENABLE_PACKING_LIST: "true"
  ENABLE_PACKING_PLANNER: "true"
  ENABLE_WARDROBE_HEALTH: "true"
  ENABLE_WARDROBE_REPORT: "true"
  ENABLE_DATA_TRUST: "true"
  ENABLE_USER_PURGE: "true"
  ENABLE_COST_GUARD: "true"
  ENABLE_V3_PURCHASE_DECISION: "true"
  ENABLE_SENSE_CHECK: "false"

x-build: &build
  context: .
  args:
    GIT_SHA: ${GIT_SHA:-unknown}

services:
  api:
    build: *build
    environment:
      <<: [*zero-cost, *product-flags]
  worker:
    build: *build
    environment:
      <<: [*zero-cost, *product-flags]
  scheduler:
    build: *build
    environment:
      <<: [*zero-cost, *product-flags]
  migrate:
    build: *build
    environment:
      <<: [*zero-cost, *product-flags]
  minio:
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
  minio-init:
    build: *build
    environment:
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: aidrobe

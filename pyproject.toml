[project]
name = "aidrobe"
version = "0.1.0"
description = "Aidrobe V1 Slim backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.10.4",
    "arq>=0.26.0",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "fastapi[standard]>=0.115.0",
    "httpx[http2]>=0.27.0",
    "open-clip-torch>=2.24.0",
    "pillow>=10.0.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "testcontainers[postgres]>=4.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP046"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "arq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rembg.*"
ignore_missing_imports = true
